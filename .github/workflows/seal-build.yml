name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install Maven 3.8.6
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.8.6/binaries/apache-maven-3.8.6-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.8.6/bin" >> "$GITHUB_PATH"
      - name: Build jars (tests run on Travis)
        run: mvn -B -V -e --no-transfer-progress -DskipTests -pl xstream -am package
      - uses: actions/upload-artifact@v4
        with:
          name: xstream-jars
          path: |
            xstream/target/xstream-1.4.20.jar
            xstream/target/xstream-1.4.20-tests.jar
          if-no-files-found: error
